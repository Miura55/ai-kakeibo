[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-kakeibo"
version = "0.1.0"
description = "Local AI household ledger with Streamlit and GLM-OCR"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2,<4",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.42,<2",
]
